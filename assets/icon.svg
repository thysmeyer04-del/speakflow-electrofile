<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark navy background with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0B1220"/>

  <defs>
    <linearGradient id="waveGrad" x1="116" y1="256" x2="396" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7BD8FF"/>
      <stop offset="1" stop-color="#2E9BFF"/>
    </linearGradient>
  </defs>

  <!-- Waveform mark centered in the icon.
       NOTE: attributes must be kebab-case (stroke-width, stop-color) — the
       previous camelCase (strokeWidth) is JSX-only and silently ignored by
       SVG renderers, which made the icon render as a blank dark square. -->
  <g transform="translate(116, 172)">
    <!-- Flowing sine waveform -->
    <path
      d="M14 84 L28 84 M42 84 C42 70, 56 70, 56 84 C56 112, 70 112, 70 84 C70 42, 84 42, 84 84 C84 140, 98 140, 98 84 C98 28, 112 28, 112 84 C112 126, 126 126, 126 84 C126 56, 140 56, 140 84 L168 84"
      stroke="url(#waveGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Three horizontal text bars -->
    <line x1="182" y1="56"  x2="238" y2="56"  stroke="#7BD8FF" stroke-width="16" stroke-linecap="round"/>
    <line x1="182" y1="84"  x2="266" y2="84"  stroke="#4FB8FF" stroke-width="16" stroke-linecap="round"/>
    <line x1="182" y1="112" x2="224" y2="112" stroke="#2E9BFF" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
