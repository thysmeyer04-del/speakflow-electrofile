<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowcast controls</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .bar {
      height: 64px; margin: 4px; padding: 8px 10px 8px 13px; display: flex; align-items: center; gap: 10px;
      border: 1px solid rgba(255,255,255,.14); border-radius: 18px; color: #fff;
      background: rgba(22,24,29,.96); box-shadow: 0 12px 34px rgba(0,0,0,.35);
      -webkit-app-region: drag; user-select: none;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 0 5px rgba(255,77,94,.15); }
    body[data-state="paused"] .dot { background: #f7b84b; box-shadow: 0 0 0 5px rgba(247,184,75,.14); }
    .readout { width: 82px; line-height: 1.05; }
    #timer { display: block; font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: .02em; }
    #status { display: block; margin-top: 4px; color: #aeb4c0; font-size: 10px; white-space: nowrap; }
    button {
      -webkit-app-region: no-drag; height: 38px; padding: 0 13px; border: 0; border-radius: 11px;
      color: #f6f7f9; background: #353943; font: 600 12px/1 "Segoe UI", sans-serif; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #454b58; }
    button:disabled { cursor: default; opacity: .45; }
    #stop { background: #e64858; }
    #stop:hover:not(:disabled) { background: #f25565; }
    #discard { width: 38px; padding: 0; color: #c8ccd5; background: transparent; font-size: 18px; }
  </style>
</head>
<body data-state="starting">
  <main class="bar" aria-label="Flowcast recording controls">
    <span class="dot" aria-hidden="true"></span>
    <div class="readout"><span id="timer">00:00</span><span id="status">Starting capture…</span></div>
    <button id="pause" type="button" disabled>Ⅱ Pause</button>
    <button id="stop" type="button" disabled>■ Stop & save</button>
    <button id="discard" type="button" title="Discard recording" aria-label="Discard recording" disabled>×</button>
  </main>
  <script src="flowcast-control.js"></script>
</body>
</html>
