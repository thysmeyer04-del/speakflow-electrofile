<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Speakflow Overlay</title>
    <style>
      :root {
        --accent-cyan: #FFB347;
        --accent-blue: #FF6B35;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Collapsed handle (thin line, visible when idle) ───────────────── */
      .handle {
        position: absolute;
        width: 56px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.50);
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      body[data-handle-hidden] .handle {
        opacity: 0;
      }
      body[data-hovering] .handle,
      body[data-recording] .handle {
        opacity: 0;
      }

      /* ── Expanded pill ─────────────────────────────────────────────────── */
      /* Hugs its content (width: max-content) instead of stretching across
         the whole overlay window — a compact pill the waveform fills. */
      .overlay {
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 8px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          rgba(11, 18, 32, 0.90) 0%,
          rgba(5, 10, 22, 0.94) 100%
        );
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        /* No external box-shadow — removes the dark glow outside the pill */
        /* Hidden by default — shown on hover or while recording */
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        will-change: opacity;
      }

      /* Show pill on hover or while recording */
      body[data-hovering] .overlay,
      body[data-recording] .overlay {
        opacity: 1;
      }

      /* Solid border — renders crisp without GPU acceleration */
      .overlay {
        border: 1.5px solid rgba(255, 107, 53, 0.75);
      }

      /* ── Animated bars (centre) ────────────────────────────────────────── */
      /* Blue in every active state (listening AND transcribing) — the state
         difference is carried by the label + animation style, not color. */
      .bars {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 26px;
      }
      .bars span {
        display: block;
        width: 3px;
        border-radius: 2px;
        background: linear-gradient(180deg, #7BD8FF 0%, #2E9BFF 100%);
        box-shadow: 0 0 4px rgba(80, 170, 255, 0.55);
        transition: height 75ms ease-out;
        min-height: 3px;
        height: 3px;
      }

      /* ── Hotkey label (right, hidden while recording) ──────────────────── */
      .hotkey-label {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.50);
        white-space: nowrap;
        letter-spacing: 0.02em;
        flex-shrink: 0;
      }
      body[data-recording] .hotkey-label {
        display: none;
      }

      /* ── Live partial transcript (streaming mode) ──────────────────────── */
      /* Single ellipsized line of the accumulated transcript while the user
         is still talking. Hidden when empty (the [data-has-partial] gate) so
         the pill stays compact. The max-width keeps the whole pill well
         under 560px even with bars + status label. */
      .partial-text {
        display: none;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.01em;
        max-width: 330px;
        flex-shrink: 1;
      }
      body[data-has-partial][data-mode='recording'] .partial-text,
      body[data-has-partial][data-mode='processing'] .partial-text {
        display: block;
      }

      /* ── Status label: tells the user WHAT the app is doing ─────────────── */
      .status-label {
        display: none;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        letter-spacing: 0.02em;
        flex-shrink: 0;
      }
      body[data-mode='starting'] .status-label,
      body[data-mode='recording'] .status-label,
      body[data-mode='processing'] .status-label,
      body[data-mode='transforming'] .status-label {
        display: block;
      }
      .status-label { color: rgba(123, 216, 255, 0.95); }
      body[data-mode='starting'] .status-label { color: rgba(123, 216, 255, 0.75); }

      /* Active states carry a blue border (idle hover keeps the brand orange) */
      body[data-recording] .overlay {
        border-color: rgba(46, 155, 255, 0.75);
      }

      /* ── Starting: quick amber pulse — instant feedback on the hotkey ───── */
      @keyframes start-pulse {
        0%, 100% { height: 4px;  opacity: 0.45; }
        50%      { height: 12px; opacity: 1; }
      }
      body[data-mode='starting'] .bars span {
        animation: start-pulse 600ms ease-in-out infinite;
      }

      /* ── Processing/Transforming: blue sequential wave — clearly NOT
             listening anymore, the audio is being transcribed ─────────────── */
      @keyframes proc-wave {
        0%, 100% { height: 4px; }
        50%      { height: 18px; }
      }
      body[data-mode='processing'] .bars span,
      body[data-mode='transforming'] .bars span {
        animation: proc-wave 900ms ease-in-out infinite;
      }
      body[data-mode='starting'] .bars span:nth-child(2),
      body[data-mode='processing'] .bars span:nth-child(2),
      body[data-mode='transforming'] .bars span:nth-child(2)   { animation-delay: 70ms; }
      body[data-mode='starting'] .bars span:nth-child(3),
      body[data-mode='processing'] .bars span:nth-child(3),
      body[data-mode='transforming'] .bars span:nth-child(3)   { animation-delay: 140ms; }
      body[data-mode='starting'] .bars span:nth-child(4),
      body[data-mode='processing'] .bars span:nth-child(4),
      body[data-mode='transforming'] .bars span:nth-child(4)   { animation-delay: 210ms; }
      body[data-mode='starting'] .bars span:nth-child(5),
      body[data-mode='processing'] .bars span:nth-child(5),
      body[data-mode='transforming'] .bars span:nth-child(5)   { animation-delay: 280ms; }
      body[data-mode='starting'] .bars span:nth-child(6),
      body[data-mode='processing'] .bars span:nth-child(6),
      body[data-mode='transforming'] .bars span:nth-child(6)   { animation-delay: 350ms; }
      body[data-mode='starting'] .bars span:nth-child(7),
      body[data-mode='processing'] .bars span:nth-child(7),
      body[data-mode='transforming'] .bars span:nth-child(7)   { animation-delay: 420ms; }
      body[data-mode='starting'] .bars span:nth-child(8),
      body[data-mode='processing'] .bars span:nth-child(8),
      body[data-mode='transforming'] .bars span:nth-child(8)   { animation-delay: 490ms; }
      body[data-mode='starting'] .bars span:nth-child(9),
      body[data-mode='processing'] .bars span:nth-child(9),
      body[data-mode='transforming'] .bars span:nth-child(9)   { animation-delay: 560ms; }
      body[data-mode='starting'] .bars span:nth-child(10),
      body[data-mode='processing'] .bars span:nth-child(10),
      body[data-mode='transforming'] .bars span:nth-child(10)  { animation-delay: 630ms; }
      body[data-mode='starting'] .bars span:nth-child(11),
      body[data-mode='processing'] .bars span:nth-child(11),
      body[data-mode='transforming'] .bars span:nth-child(11)  { animation-delay: 700ms; }

      /* Error state: dim the bars */
      body[data-mode='error'] .bars span {
        opacity: 0.3;
      }

      /* Error message label */
      .error-label {
        display: none;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        color: rgba(255, 120, 80, 0.95);
        white-space: nowrap;
        letter-spacing: 0.01em;
        flex-shrink: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 340px;
      }
      body[data-mode='error'] .error-label {
        display: block;
      }
      body[data-mode='error'] .hotkey-label {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Collapsed handle: thin translucent line when idle -->
    <div class="handle" id="handle"></div>

    <!-- Expanded pill: bars + label -->
    <div class="overlay" id="overlay">
      <!-- 11 animated bars — a full waveform that fills the pill -->
      <div class="bars" id="bars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Live status: Starting… / Listening / Transcribing… -->
      <span class="status-label" id="status-label"></span>

      <!-- Live partial transcript (streaming mode, tail-ellipsized) -->
      <span class="partial-text" id="partial-text"></span>

      <!-- Hotkey hint -->
      <span class="hotkey-label" id="hotkey-label">F11 to dictate</span>

      <!-- Error message (shown only on error state) -->
      <span class="error-label" id="error-label"></span>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
