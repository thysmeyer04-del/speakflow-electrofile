<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Speakflow Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'DM Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-app-region: no-drag;
      }

      .overlay {
        position: absolute;
        inset: auto 8px 8px 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 18px 0 16px;
        background: rgba(20, 19, 18, 0.86);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        color: #fff;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 200ms cubic-bezier(0.4, 0, 0.2, 1),
                    transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .overlay.visible { opacity: 1; transform: translateY(0); }

      .pulse {
        width: 8px; height: 8px;
        background: #ef4444;
        border-radius: 50%;
        animation: pulse 1.2s infinite ease-in-out;
        flex-shrink: 0;
      }
      .pulse.processing { background: #f59e0b; animation-duration: 0.6s; }
      .pulse.error { background: #ef4444; animation: none; }

      .wave {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 22px;
      }
      .wave span {
        display: block;
        width: 3px;
        background: #2D9B78;
        border-radius: 3px;
        animation: wave 0.85s ease-in-out infinite;
      }
      .wave span:nth-child(1) { animation-delay: 0s; }
      .wave span:nth-child(2) { animation-delay: 0.08s; }
      .wave span:nth-child(3) { animation-delay: 0.16s; }
      .wave span:nth-child(4) { animation-delay: 0.24s; }
      .wave span:nth-child(5) { animation-delay: 0.16s; }
      .wave span:nth-child(6) { animation-delay: 0.08s; }
      .wave span:nth-child(7) { animation-delay: 0s; }

      .label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.94);
        white-space: nowrap;
      }

      .label .sub {
        color: rgba(255, 255, 255, 0.5);
        margin-left: 6px;
        font-size: 12px;
        font-weight: 400;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.45; transform: scale(0.78); }
      }
      @keyframes wave {
        0%, 100% { height: 4px; }
        50%      { height: 22px; }
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <span class="pulse" id="pulse"></span>
      <div class="wave" id="wave">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <span class="label" id="label">Listening<span class="sub">— release to stop</span></span>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
