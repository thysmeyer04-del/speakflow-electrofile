<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Speakflow Overlay</title>
    <style>
      :root {
        --accent-cyan: #FFB347;
        --accent-blue: #FF6B35;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Collapsed handle (thin line, visible when idle) ───────────────── */
      .handle {
        position: absolute;
        width: 56px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.50);
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      body[data-handle-hidden] .handle {
        opacity: 0;
      }
      body[data-hovering] .handle,
      body[data-recording] .handle {
        opacity: 0;
      }

      /* ── Expanded pill ─────────────────────────────────────────────────── */
      .overlay {
        position: absolute;
        inset: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 12px;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          rgba(11, 18, 32, 0.90) 0%,
          rgba(5, 10, 22, 0.94) 100%
        );
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        /* No external box-shadow — removes the dark glow outside the pill */
        /* Hidden by default — shown on hover or while recording */
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        will-change: opacity;
      }

      /* Show pill on hover or while recording */
      body[data-hovering] .overlay,
      body[data-recording] .overlay {
        opacity: 1;
      }

      /* Solid border — renders crisp without GPU acceleration */
      .overlay {
        border: 1.5px solid rgba(255, 107, 53, 0.75);
      }

      /* ── Speakflow waveform icon (left) ────────────────────────────────── */
      .icon-mark {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        opacity: 0.90;
      }

      /* ── Animated bars (centre) ────────────────────────────────────────── */
      .bars {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 24px;
      }
      .bars span {
        display: block;
        width: 3px;
        border-radius: 2px;
        background: linear-gradient(180deg, #FFB347 0%, #FF6B35 100%);
        box-shadow: 0 0 4px rgba(255, 179, 71, 0.50);
        transition: height 75ms ease-out;
        min-height: 3px;
        height: 3px;
      }

      /* ── Hotkey label (right, hidden while recording) ──────────────────── */
      .hotkey-label {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.50);
        white-space: nowrap;
        letter-spacing: 0.02em;
        flex-shrink: 0;
      }
      body[data-recording] .hotkey-label {
        display: none;
      }

      /* Error state: dim the bars */
      body[data-mode='error'] .bars span {
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <!-- Collapsed handle: thin translucent line when idle -->
    <div class="handle" id="handle"></div>

    <!-- Expanded pill: icon + bars + label -->
    <div class="overlay" id="overlay">
      <!-- Speakflow waveform mark -->
      <svg class="icon-mark" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="1"  y="5"  width="2" height="6"  rx="1" fill="#FFB347"/>
        <rect x="4"  y="2"  width="2" height="12" rx="1" fill="#FF8555"/>
        <rect x="7"  y="4"  width="2" height="8"  rx="1" fill="#FF6B35"/>
        <rect x="10" y="2"  width="2" height="12" rx="1" fill="#FF8555"/>
        <rect x="13" y="5"  width="2" height="6"  rx="1" fill="#FFB347"/>
      </svg>

      <!-- 5 animated bars -->
      <div class="bars" id="bars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Hotkey hint -->
      <span class="hotkey-label" id="hotkey-label">F11 to dictate</span>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
