<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Speakflow Overlay</title>
    <style>
      :root {
        --accent-cyan: #6ad6ff;
        --accent-blue: #3a83ff;
        --accent-violet: #8a5bff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-app-region: no-drag;
      }

      .overlay {
        position: absolute;
        inset: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          rgba(12, 18, 36, 0.82) 0%,
          rgba(6, 10, 22, 0.90) 100%
        );
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        box-shadow:
          0 0 0 1px rgba(106, 214, 255, 0.18),
          0 0 18px rgba(58, 131, 255, 0.30),
          0 4px 20px rgba(0, 0, 0, 0.55);
        opacity: 0;
        transition: opacity 150ms ease;
        will-change: opacity;
      }
      .overlay.visible { opacity: 1; }

      /* Gradient border stroke */
      .overlay::before {
        content: '';
        position: absolute;
        inset: -1.5px;
        border-radius: 999px;
        padding: 1.5px;
        background: linear-gradient(
          90deg,
          var(--accent-cyan) 0%,
          var(--accent-blue) 50%,
          var(--accent-violet) 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }

      /* Wave bars: fixed height, scaled from center so they expand up & down */
      .bars {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 0 16px;
        height: 100%;
      }
      .bars span {
        display: block;
        width: 3px;
        height: 28px;
        border-radius: 3px;
        background: linear-gradient(
          180deg,
          var(--accent-cyan) 0%,
          var(--accent-blue) 100%
        );
        box-shadow: 0 0 5px rgba(106, 214, 255, 0.5);
        transform: scaleY(calc(0.07 + var(--h, 0) * 0.93));
        transform-origin: center;
        transition: transform 65ms ease-out;
      }

      /* Traveling sine-wave pulse while processing */
      .overlay[data-mode='idle-anim'] .bars span {
        animation: wavePulse 1.4s ease-in-out infinite;
      }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(1)  { animation-delay: 0.00s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(2)  { animation-delay: 0.08s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(3)  { animation-delay: 0.16s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(4)  { animation-delay: 0.24s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(5)  { animation-delay: 0.32s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(6)  { animation-delay: 0.40s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(7)  { animation-delay: 0.48s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(8)  { animation-delay: 0.40s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(9)  { animation-delay: 0.32s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(10) { animation-delay: 0.24s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(11) { animation-delay: 0.16s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(12) { animation-delay: 0.08s; }
      .overlay[data-mode='idle-anim'] .bars span:nth-child(13) { animation-delay: 0.00s; }

      @keyframes wavePulse {
        0%, 100% { transform: scaleY(0.07); }
        50%       { transform: scaleY(0.50); }
      }

      .overlay[data-mode='error'] .bars { opacity: 0.3; }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <div class="bars" id="bars"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
