appId: app.speakflow.desktop
productName: Speakflow
copyright: Copyright (c) 2026 Speakflow

directories:
  output: dist-electron
  buildResources: build

# All native production deps (@nut-tree-fork, onnxruntime-node) ship prebuilt
# N-API binaries that are ABI-stable across Electron versions — no rebuild
# needed. Rebuilding also breaks here: node-gyp chokes on the space in the
# project path and on locked artifacts (sharp).
npmRebuild: false

files:
  - dist/**/*
  - assets/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"

# Native modules cannot execute from inside the asar archive — the .node
# bindings and their companion DLLs must exist as real files on disk.
# Missing @xenova/onnxruntime here made local Whisper (and embeddings) crash
# the packaged app the moment the model loaded.
asarUnpack:
  - "node_modules/@nut-tree-fork/**"
  - "node_modules/@xenova/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/onnxruntime-common/**"
  - "node_modules/onnxruntime-web/**"
  - "node_modules/sharp/**"

extraResources:
  - from: assets/sounds
    to: sounds
  - from: native/bin
    to: flowcast

mac:
  icon: assets/icon.icns
  artifactName: Speakflow.dmg
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false

win:
  icon: assets/icon.ico
  artifactName: Speakflow-Setup.exe
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # "always" recreates the desktop shortcut on every update, not just first install.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Speakflow
  # Launch Speakflow immediately when the installer finishes — the user should
  # never wonder "where do I open it from" after downloading.
  runAfterFinish: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  menuCategory: false

linux:
  icon: assets/icon.png
  target:
    - AppImage
  category: Utility

publish:
  provider: github
  owner: thysmeyer04-del
  repo: speakflow-electrofile
  releaseType: release
